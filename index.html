<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Campus Lost & Found</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #07130f;
    color: white;
    min-height: 100vh;
}

header {
    background: #0b2118;
    padding: 22px 8%;
    border-bottom: 1px solid #1ed760;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #35e887;
    font-size: 25px;
    font-weight: bold;
}

nav button {
    background: transparent;
    color: white;
    border: none;
    margin-left: 20px;
    cursor: pointer;
    font-size: 15px;
}

nav button:hover {
    color: #35e887;
}

.hero {
    text-align: center;
    padding: 55px 20px 35px;
}

.hero h1 {
    font-size: 45px;
    margin-bottom: 12px;
}

.hero h1 span {
    color: #35e887;
}

.hero p {
    color: #a9bbb2;
    font-size: 17px;
    margin-bottom: 28px;
}

.main-btn {
    background: #35e887;
    color: #06120d;
    border: none;
    padding: 14px 25px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.main-btn:hover {
    background: #20c96d;
    transform: translateY(-2px);
}

.stats {
    width: 85%;
    max-width: 1000px;
    margin: 20px auto 35px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.stat {
    background: #0c2118;
    border: 1px solid #193c2c;
    border-radius: 15px;
    padding: 22px;
    text-align: center;
}

.stat h2 {
    color: #35e887;
    font-size: 32px;
}

.stat p {
    color: #a9bbb2;
    margin-top: 5px;
}

.container {
    width: 85%;
    max-width: 1100px;
    margin: auto;
}

.tools {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
    flex-wrap: wrap;
}

.search {
    flex: 1;
    min-width: 220px;
    padding: 13px;
    border-radius: 9px;
    border: 1px solid #315545;
    background: #0b1d16;
    color: white;
}

.filter {
    padding: 13px;
    border-radius: 9px;
    background: #0b1d16;
    color: white;
    border: 1px solid #315545;
}

.items {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 20px;
    padding-bottom: 50px;
}

.card {
    background: #0b1d16;
    border: 1px solid #1b3e2c;
    border-radius: 15px;
    padding: 20px;
}

.card h3 {
    margin-bottom: 12px;
}

.card p {
    color: #a9bbb2;
    margin: 8px 0;
}

.badge {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    margin-top: 8px;
}

.lost {
    background: #572222;
    color: #ff8d8d;
}

.found {
    background: #164f31;
    color: #65f3a0;
}

.card button {
    margin-top: 15px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #35e887;
    font-weight: bold;
    cursor: pointer;
}

.empty {
    text-align: center;
    color: #789087;
    padding: 40px;
    grid-column: 1/-1;
}

/* Modal */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-box {
    width: 100%;
    max-width: 500px;
    background: #0c2118;
    border: 1px solid #35e887;
    border-radius: 15px;
    padding: 25px;
}

.modal-box h2 {
    margin-bottom: 20px;
    color: #35e887;
}

.modal-box input,
.modal-box select,
.modal-box textarea {
    width: 100%;
    padding: 12px;
    margin: 7px 0 12px;
    border-radius: 8px;
    border: 1px solid #315545;
    background: #07130f;
    color: white;
}

.modal-box textarea {
    min-height: 90px;
    resize: vertical;
}

.close {
    float: right;
    cursor: pointer;
    font-size: 22px;
}

@media(max-width:650px) {

    .hero h1 {
        font-size: 34px;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    header {
        padding: 18px;
    }

    nav button {
        margin-left: 8px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🎒 Campus Lost & Found</div>

    <nav>
        <button onclick="showAll()">All Items</button>
        <button onclick="openModal()">Report Item</button>
    </nav>
</header>

<section class="hero">

    <h1>Lost something? <span>Find it.</span></h1>

    <p>
        A simple campus platform to report lost items,
        find belongings and return them to their owners.
    </p>

    <button class="main-btn" onclick="openModal()">
        + Report an Item
    </button>

</section>

<section class="stats">

    <div class="stat">
        <h2 id="totalCount">0</h2>
        <p>Total Reports</p>
    </div>

    <div class="stat">
        <h2 id="lostCount">0</h2>
        <p>Lost Items</p>
    </div>

    <div class="stat">
        <h2 id="foundCount">0</h2>
        <p>Found Items</p>
    </div>

</section>

<div class="container">

    <div class="tools">

        <input
            id="search"
            class="search"
            placeholder="🔍 Search item, location..."
            oninput="displayItems()"
        >

        <select
            id="filter"
            class="filter"
            onchange="displayItems()"
        >
            <option value="all">All</option>
            <option value="lost">Lost</option>
            <option value="found">Found</option>
        </select>

    </div>

    <div id="items" class="items"></div>

</div>


<!-- REPORT MODAL -->

<div id="modal" class="modal">

    <div class="modal-box">

        <span class="close" onclick="closeModal()">✕</span>

        <h2>Report an Item</h2>

        <form id="itemForm">

            <label>Item Name</label>

            <input
                id="itemName"
                placeholder="Example: Black Wallet"
                required
            >

            <label>Report Type</label>

            <select id="itemType">

                <option value="lost">I Lost This</option>

                <option value="found">I Found This</option>

            </select>

            <label>Category</label>

            <select id="category">

                <option>Electronics</option>
                <option>Documents</option>
                <option>Books</option>
                <option>Accessories</option>
                <option>Others</option>

            </select>

            <label>Location</label>

            <input
                id="location"
                placeholder="Example: EM4 Block"
                required
            >

            <label>Description</label>

            <textarea
                id="description"
                placeholder="Describe the item..."
                required
            ></textarea>

            <label>Contact</label>

            <input
                id="contact"
                placeholder="Email or phone"
                required
            >

            <button class="main-btn" type="submit">
                Submit Report
            </button>

        </form>

    </div>

</div>


<script>

let items = JSON.parse(localStorage.getItem("campusItems")) || [

    {
        id: 1,
        name: "Black Wallet",
        type: "lost",
        category: "Accessories",
        location: "EM4 Block",
        description: "Black leather wallet",
        contact: "student@example.com"
    },

    {
        id: 2,
        name: "Scientific Calculator",
        type: "found",
        category: "Electronics",
        location: "Library",
        description: "Casio calculator found near study table",
        contact: "student2@example.com"
    }

];


function saveItems() {

    localStorage.setItem(
        "campusItems",
        JSON.stringify(items)
    );

}


function displayItems() {

    const container = document.getElementById("items");

    const search =
        document.getElementById("search").value.toLowerCase();

    const filter =
        document.getElementById("filter").value;

    let filtered = items.filter(item => {

        const matchesSearch =
            item.name.toLowerCase().includes(search) ||
            item.location.toLowerCase().includes(search) ||
            item.category.toLowerCase().includes(search);

        const matchesFilter =
            filter === "all" ||
            item.type === filter;

        return matchesSearch && matchesFilter;

    });


    if(filtered.length === 0) {

        container.innerHTML =
            `<div class="empty">
                No items found 😕
             </div>`;

    }

    else {

        container.innerHTML = filtered.map(item => `

            <div class="card">

                <h3>
                    ${item.type === "lost" ? "🔎" : "📦"}
                    ${item.name}
                </h3>

                <p>📍 ${item.location}</p>

                <p>🏷️ ${item.category}</p>

                <p>${item.description}</p>

                <span class="badge ${item.type}">
                    ${item.type === "lost" ? "🔴 LOST" : "🟢 FOUND"}
                </span>

                ${
                    item.type === "lost"

                    ?

                    `<button onclick="markFound(${item.id})">
                        I Found This
                    </button>`

                    :

                    `<button onclick="contactOwner('${item.contact}')">
                        Contact Reporter
                    </button>`
                }

            </div>

        `).join("");

    }


    updateStats();

}


function updateStats() {

    document.getElementById("totalCount").innerText =
        items.length;

    document.getElementById("lostCount").innerText =
        items.filter(item => item.type === "lost").length;

    document.getElementById("foundCount").innerText =
        items.filter(item => item.type === "found").length;

}


function markFound(id) {

    const item = items.find(item => item.id === id);

    if(item) {

        item.type = "found";

        saveItems();

        displayItems();

        alert("Item marked as FOUND! 🎉");

    }

}


function contactOwner(contact) {

    alert(
        "Contact the reporter at: " + contact
    );

}


function openModal() {

    document.getElementById("modal").style.display = "flex";

}


function closeModal() {

    document.getElementById("modal").style.display = "none";

}


document.getElementById("itemForm").addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const newItem = {

            id: Date.now(),

            name:
                document.getElementById("itemName").value,

            type:
                document.getElementById("itemType").value,

            category:
                document.getElementById("category").value,

            location:
                document.getElementById("location").value,

            description:
                document.getElementById("description").value,

            contact:
                document.getElementById("contact").value

        };


        items.unshift(newItem);

        saveItems();

        displayItems();

        this.reset();

        closeModal();

        alert("Report submitted successfully! ✅");

    }
);


function showAll() {

    document.getElementById("filter").value = "all";

    document.getElementById("search").value = "";

    displayItems();

}


displayItems();

</script>

</body>
</html>
<!-- Campus Lost & Found -->
